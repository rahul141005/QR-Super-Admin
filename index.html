<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>QuantReflex Super Admin</title>
  <link rel="stylesheet" href="css/admin-style.css" />
</head>
<body>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-screen" style="display:none;">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Super Admin Access Only</p>
      </div>
      <div id="loginForm">
        <div class="login-field">
          <label for="loginEmail" class="login-label">Email</label>
          <input type="email" id="loginEmail" class="login-input" placeholder="admin@quantreflex.com" autocomplete="email" autocapitalize="off" />
        </div>
        <div class="login-field">
          <label for="loginPassword" class="login-label">Password</label>
          <input type="password" id="loginPassword" class="login-input" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button id="loginBtn" class="btn accent login-btn">Secure Login</button>
      </div>
      <p class="login-footer">🔒 Protected by Firebase Authentication.</p>
    </div>
  </div>

  <!-- ==================== MAIN DASHBOARD LAYOUT ==================== -->
  <div id="appContainer" class="app-container" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>QuantReflex Admin</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-link active" data-view="dashboard">
          <span class="icon">📊</span> Dashboard
        </a>
        <a href="#users" class="nav-link" data-view="users">
          <span class="icon">👥</span> Users
        </a>
        <a href="#questions" class="nav-link" data-view="questions">
          <span class="icon">📝</span> Questions Bank
        </a>
        <a href="#system" class="nav-link" data-view="system">
          <span class="icon">⚙️</span> System Logs
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn logout-btn">Log Out</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Loading Overlay -->
      <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
      </div>
      
      <!-- Views -->
      <div id="view-dashboard" class="spa-view active"></div>
      <div id="view-users" class="spa-view" style="display:none;"></div>
      <div id="view-questions" class="spa-view" style="display:none;"></div>
      <div id="view-system" class="spa-view" style="display:none;"></div>
    </main>
  </div>

  <!-- Scripts -->
  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/table-builder.js"></script>
  <script src="js/components/modal-builder.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/questions.js"></script>
  <script src="js/views/system.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
