<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="QuantReflex Super Admin Panel — Manage users, questions, and system operations." />
  <title>QuantReflex Admin</title>
  <link rel="stylesheet" href="css/admin-style.css" />
</head>
<body>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">QR</div>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Super Admin Access Only</p>
      </div>
      <div id="loginForm">
        <div class="login-field">
          <label for="loginEmail" class="login-label">Email</label>
          <input type="email" id="loginEmail" class="login-input" placeholder="admin@quantreflex.com" autocomplete="email" autocapitalize="off" />
        </div>
        <div class="login-field">
          <label for="loginPassword" class="login-label">Password</label>
          <input type="password" id="loginPassword" class="login-input" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button id="loginBtn" class="btn accent login-btn">Secure Login</button>
      </div>
      <p class="login-footer">🔒 Protected by Firebase Authentication</p>
    </div>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div id="appShell" class="app-shell" style="display:none;">

    <!-- Mobile Header -->
    <header class="top-bar">
      <button id="menuToggle" class="menu-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <h1 class="top-bar-title">Dashboard</h1>
      <button id="logoutBtnTop" class="top-bar-action" aria-label="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">QR</div>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#users" class="nav-item" data-view="users">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          <span>Users</span>
        </a>
        <a href="#questions" class="nav-item" data-view="questions">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Questions</span>
        </a>
        <a href="#system" class="nav-item" data-view="system">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>System</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtnSidebar" class="sidebar-logout">Log Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-users" class="view"></div>
      <div id="view-questions" class="view"></div>
      <div id="view-system" class="view"></div>
    </main>

  </div>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div id="modalContainer"></div>

  <!-- ==================== TOAST ==================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (layered like main app) -->
  <script src="js/state/store.js"></script>
  <script src="js/firebase/firebase.js"></script>
  <script src="js/firebase/auth.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/table.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/questions.js"></script>
  <script src="js/views/system.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
